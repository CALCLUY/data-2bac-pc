name: Download corpus PDFs

# Runs the downloader on a GitHub runner (full internet access) and
# publishes the PDFs on the `corpus-pdfs` branch + a PR.
#
# Triggers:
#   - automatically when the corpus index or the script changes on main
#   - manually: GitHub repo page → Actions → "Download corpus PDFs" → Run workflow
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "2BAC_PC_Corpus/**"
      - "scripts/download_corpus.py"
      - ".github/workflows/corpus-pdfs.yml"

permissions:
  contents: write
  pull-requests: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download all referenced PDFs
        run: python3 scripts/download_corpus.py --delay 0.3

      - name: Publish to corpus-pdfs branch + PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -B corpus-pdfs
          git add 2BAC_PC_Corpus
          if git diff --cached --quiet; then
            echo "No new/changed PDFs to publish."
            exit 0
          fi

          git commit -m "Corpus PDFs — auto-download ($(date +%F))"
          git push -f origin corpus-pdfs

          if gh pr list --head corpus-pdfs --state open --json number -q '.[0].number' | grep -q .; then
            echo "Existing corpus-pdfs PR updated."
          else
            gh pr create --head corpus-pdfs --base main \
              --title "Downloaded corpus PDFs (2BAC PC)" \
              --body "Automated download of the PDFs referenced by 2BAC_PC_Corpus (script: scripts/download_corpus.py). Check 2BAC_PC_Corpus/download_report.md for any failed links. Merge to publish the PDFs on main."
          fi
          echo "PDFs published on the corpus-pdfs branch - review the PR."
